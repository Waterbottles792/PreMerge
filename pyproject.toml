[project]
name = "premerge"
version = "0.1.0"
description = "Predicts merge conflicts before they happen by analyzing git history coupling and live branch divergence."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
premerge = "premerge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["premerge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
